services:
  # Backend Web Service (Free Tier)
  - type: web
    name: cryptex-echo-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        fromService:
          name: cryptex-echo-frontend
          type: web
          property: host
      - key: WEBULL_EMAIL
        sync: false
      - key: WEBULL_PASSWORD
        sync: false
      - key: WEBULL_TRADE_PIN
        sync: false

  # Frontend Static Site (Zero Cost)
  - type: web
    name: cryptex-echo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: cryptex-echo-backend
          type: web
          property: host
